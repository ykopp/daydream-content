name: Publish Daydream stable pointer

on:
  push:
    branches: [main]
    paths: [stable.json, app-stable.json, sha256.json, rights-ledger.json, .github/workflows/publish-pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
